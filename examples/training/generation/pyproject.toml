[project]
name = "atlas-generation-training"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
 "torch==2.8.0", "transformers==4.57.1", "peft==0.17.1", "accelerate==1.12.0",
 "numpy==2.3.5", "rouge-score==0.1.2", "sacrebleu==2.5.1", "bert-score==0.3.13",
 "ipykernel==7.1.0", "nbclient==0.10.4", "nbformat==5.10.4"
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
