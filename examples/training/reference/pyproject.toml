[project]
name = "atlas-reference"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.8.0", "transformers==4.57.1", "numpy==2.2.6", "peft==0.17.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
