[project]
name = "atlas-discovery"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0",
  "transformers==4.57.1",
  "numpy==2.3.5",
  "sentence-transformers==5.1.2",
  "scikit-learn==1.7.2",
  "bertopic==0.17.4",
  "umap-learn==0.5.9.post2",
  "hdbscan==0.8.40",
  "sentencepiece==0.2.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
