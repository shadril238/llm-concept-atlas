[project]
name = "atlas-retrieval"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
 "torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1",
 "numpy==2.3.5", "sentence-transformers==5.1.2", "scikit-learn==1.7.2",
 "open-clip-torch==3.3.0", "pillow==11.3.0", "accelerate==1.12.0",
 "sentencepiece==0.2.1", "ipykernel==7.1.0", "nbclient==0.10.4", "nbformat==5.10.4",
]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
