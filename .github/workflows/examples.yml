name: Verify examples
on:
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: Run the pinned public CPU model smoke example
        type: boolean
        default: false
      reference:
        description: Run the E2 tokenizer and CPU training reference workflows
        type: boolean
        default: false
      e3:
        description: Run the E3 CPU foundation labs (downloads public models and GloVe)
        type: boolean
        default: false
      e4:
        description: Run E4 CPU classification and BERTopic workflows (public model downloads)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
      - run: uv sync --locked --project examples/foundations
      - run: python3 scripts/sync-examples.py --check
      - run: python3 -m unittest discover -s tests/examples -v
      - run: python3 scripts/run-examples.py
  model:
    if: github.event_name == 'workflow_dispatch' && inputs.model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
      - run: uv sync --locked --project examples/applications
      - run: python3 scripts/run-examples.py --id embedding-retrieval --allow-network --record
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cpu-model-verification
          path: examples/verification/records/embedding-retrieval*.json
  reference:
    if: github.event_name == 'workflow_dispatch' && inputs.reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
      - run: uv sync --locked --project examples/training/reference
      - run: python3 scripts/run-examples.py --id tokenizer-comparison --id lora-tiny-training --id lora-pretrained --id ner-training --allow-network --record
      - run: examples/training/reference/.venv/bin/python examples/training/reference/test_model_contracts.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2-reference-verification
          path: |
            examples/verification/records/*training*.json
            examples/verification/records/lora-*.json
            examples/verification/records/tokenizer-comparison*.json
            examples/artifacts/*/results.json
  e3:
    if: github.event_name == 'workflow_dispatch' && inputs.e3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
      - run: uv sync --locked --project examples/training/reference
      - run: python3 scripts/run-examples.py --id first-generation --id representation-inspection --id playlist-embeddings --id transparent-transformer --id cache-equivalence --allow-network --record
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e3-foundation-verification
          path: |
            examples/verification/records/first-generation*.json
            examples/verification/records/representation-inspection*.json
            examples/verification/records/playlist-embeddings*.json
            examples/verification/records/transparent-transformer*.json
            examples/verification/records/cache-equivalence*.json
            examples/artifacts/e3-*/results.json
  e4:
    if: github.event_name == 'workflow_dispatch' && inputs.e4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
      - run: uv sync --locked --project examples/applications/discovery
      - run: python3 scripts/run-examples.py --id bertopic-pipeline --allow-network --record
      - run: python3 scripts/run-examples.py --id modular-bertopic --allow-network --record
      - run: python3 scripts/run-examples.py --id topic-label-generation --allow-network --record
      - run: python3 scripts/run-examples.py --id classification-comparison --allow-network --record
      - run: examples/applications/discovery/.venv/bin/python examples/applications/discovery/test_models.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e4-discovery-verification
          path: |
            examples/verification/records/classification-comparison*.json
            examples/verification/records/modular-bertopic*.json
            examples/verification/records/bertopic-pipeline*.json
            examples/verification/records/topic-label-generation*.json
            examples/artifacts/e4-*/results.json
